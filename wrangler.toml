# Cloudflare Pages: `npx wrangler pages deploy` toma de acá el nombre y la carpeta del build.
# La carpeta functions/ (los proxys /api/segments, /api/tmdb y /api/subs, y /api/report) se sube sola.
name = "series-pelis"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Con este archivo, los bindings (D1, KV) se manejan desde acá: el botón "Add" del panel queda desactivado.
# Los secretos sí se cargan en el panel (Settings → Variables and Secrets) o con wrangler, nunca acá.
# Los ids de abajo no son secretos: solo dicen qué base usar y sin acceso a la cuenta no sirven.

# ---- Base D1 (login de las casas y sincronización, desde la v0.17) ----
# Creada en el panel: Storage & Databases → D1 → `series-pelis`. Las tablas las crea la app.
# Con la base enlazada la app pide entrar con una casa (y /api/tmdb y /api/subs también). Sin ella, todo como antes.
[[d1_databases]]
binding = "DB"
database_name = "series-pelis"
database_id = "da6e1fd0-df31-46db-a965-d3b74591fe42"

# Las previews (cada PR o rama) usan otra base, así lo que se prueba no toca las casas de verdad.
# Creada en el panel: `series-pelis-preview`. Lo de arriba vale para producción y `wrangler pages dev`.
# Ojo: con [env.preview], los bindings (d1_databases, kv_namespaces, vars…) NO se heredan: si se suma uno arriba,
# hay que repetirlo acá (si no, el deploy de las previews falla).
[[env.preview.d1_databases]]
binding = "DB"
database_name = "series-pelis-preview"
database_id = "599f2e78-229c-430e-baf9-9e146a04dc9c"

# ---- Informes de errores (functions/api/report) ----
# Sin el KV, /api/report/_status contesta { enabled: false } y la app no muestra nada de esto.
#
# 1. Crear el namespace:   npx wrangler kv namespace create REPORTS
#    (o en el panel: Storage & Databases → KV) y descomentar el bloque de abajo con su id
#    (el panel no deja enlazarlo: los bindings salen de este archivo).
# 2. Secreto para leer los informes (una clave larga al azar, ej. `openssl rand -hex 32`):
#    npx wrangler pages secret put REPORT_ADMIN_KEY
# 3. Leerlos:  curl -H "Authorization: Bearer $REPORT_ADMIN_KEY" "https://<sitio>/api/report?limit=50"
#
# Los informes vencen solos a los 30 días. Nunca contienen URLs de addons ni de streams: solo el host.
#
# [[kv_namespaces]]
# binding = "REPORTS"
# id = "<id del namespace>"
# (y lo mismo en [[env.preview.kv_namespaces]], con otro namespace o el mismo)

# Secretos del sitio (se cargan con `npx wrangler pages secret put <NOMBRE>`, nunca van acá):
#   TMDB_KEY          key v3 o token v4 de TMDB para /api/tmdb (opcional).
#   REPORT_ADMIN_KEY  clave para listar los informes de /api/report (opcional; sin ella el GET devuelve 404).
#   SUBDL_KEY         key de SubDL para los subtítulos online de /api/subs (opcional; ver /api/subs/_status).
#   OPENSUBTITLES_KEY respaldo de /api/subs cuando SubDL no trae nada (opcional). Con OPENSUBTITLES_USER y
#                     OPENSUBTITLES_PASS (una cuenta aparte para la app) pasa de 5 a 20 descargas por día.
#   ADMIN_KEY         clave del administrador (mínimo 32 caracteres, ej. `openssl rand -hex 32`). Con ella se
#                     entra la primera vez ("Soy el administrador") y se crea la casa principal. Sin ella nadie
#                     puede arrancar el login.
